# Records two rezolus .dendro archives under thread and cgroup churn
# (loadgen.c), for dendro's segment-encoding probe. Agent and recorder are
# built from iopsystems/rezolus at ba47c3f5a7b91e2fd4820aaf4ed8ed4182d6b82b. Each run: 700 s recording, 30 s
# quiet, 600 s of load, then quiet; heavy threads (10 ms CPU each), at a
# 1 s and a 100 ms interval. The agent runs config/agent.toml with
# task_attribution = true added (per-thread series are off by default).
name = "dendro-segenc-recordings"

[[jobs]]
name = "vm"
tags = ["hypervisor", "x86_64", "scratch"]

[[jobs.steps]]
uses = "anvil-vm"
[jobs.steps.with]
shape = "auto.c"
image = "debian-13-6.12"
gpu = false
boot_timeout = 300
payload_timeout = 7200
artifacts = ["/tmp/job/run.log", "/tmp/job/status", "/tmp/job/heavy-1s.dendro.zst", "/tmp/job/heavy-100ms.dendro.zst"]
payload = '''
set -o pipefail
mkdir -p /tmp/job
echo 1 > /tmp/job/status
{
  uname -r; nproc; cat /etc/anvil-image.json 2>/dev/null | grep build
  mount | grep cgroup2
  sudo apt-get update -qq >/dev/null 2>&1
  sudo apt-get install -y -qq clang libelf-dev zlib1g-dev pkg-config zstd sqlite3 gcc curl >/dev/null 2>&1 || { echo APT FAILED; exit 1; }
  cd /tmp/job
  git clone -q https://github.com/iopsystems/rezolus rezolus && cd rezolus && git checkout -q ba47c3f5a7b91e2fd4820aaf4ed8ed4182d6b82b || { echo CLONE FAILED; exit 1; }
  git rev-parse HEAD
  cargo build --release -q > /tmp/job/build.log 2>&1 || { tail -40 /tmp/job/build.log; echo BUILD FAILED; exit 1; }
  sccache --stop-server >/dev/null 2>&1 || true
  ./target/release/rezolus --version
  echo "" | base64 -d > /tmp/job/loadgen.c
  cc -O2 -pthread -o /tmp/job/loadgen /tmp/job/loadgen.c || { echo LOADGEN BUILD FAILED; exit 1; }
  # The image runs its own rezolus agent on :4241; stop it so the built one serves.
  sudo systemctl stop rezolus 2>/dev/null; sudo systemctl disable rezolus 2>/dev/null; sleep 2
  sudo ss -ltnp | grep ':4241 ' && { echo "PORT 4241 STILL TAKEN"; exit 1; }
  # Per-thread series are off by default in 6.0; turn them on, defaults otherwise.
  sed -i 's/^\[samplers.cpu_usage\]$/[samplers.cpu_usage]\ntask_attribution = true/' config/agent.toml
  grep -n -A1 '^\[samplers.cpu_usage\]' config/agent.toml
  sudo ./target/release/rezolus config/agent.toml > /tmp/job/agent.log 2>&1 &
  for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4241/ && break; sleep 1; done
  curl -s -o /dev/null -w "agent http %{http_code}\n" http://localhost:4241/
  sudo ss -ltnp | grep ':4241 '
  sudo ss -ltnp | grep ':4241 ' | grep -q 'target/release/rezolus\|"rezolus",pid' || true
  pgrep -af 'target/release/rezolus config' || { echo "BUILT AGENT NOT RUNNING"; tail -20 /tmp/job/agent.log; exit 1; }
  ok=1
  for run in "heavy-1s 1s" "heavy-100ms 100ms"; do
    set -- $run; name=$1; interval=$2
    echo "=== $name: interval $interval ==="
    ./target/release/rezolus record --url http://localhost:4241 -o /tmp/job/$name.dendro --interval $interval --duration 700s > /tmp/job/$name-record.log 2>&1 &
    rec=$!
    sleep 30
    sudo /tmp/job/loadgen 600 10 300 5 50 2>&1 | sed "s/^/[$name] /"
    wait $rec; echo "record exited $?"
    tail -5 /tmp/job/$name-record.log
    ls -la /tmp/job/$name.dendro*
    sqlite3 -readonly "file:/tmp/job/$name.dendro?immutable=1" "select stream, count(*), sum(length(bytes)) from segments group by stream order by 3 desc limit 12;" || ok=0
    zstd -q -3 -T0 -f /tmp/job/$name.dendro -o /tmp/job/$name.dendro.zst && zstd -q -t /tmp/job/$name.dendro.zst && ls -la /tmp/job/$name.dendro.zst || ok=0
  done
  sudo pkill -f 'rezolus config/agent.toml' || true
  grep -i -m5 'error\|panic' /tmp/job/agent.log
  [ $ok = 1 ] && echo 0 > /tmp/job/status
} 2>&1 | tee /tmp/job/run.log
exit 0
'''

[[jobs.steps]]
uses = "upload-artifact"
[jobs.steps.with]
path = "run.log"

[[jobs.steps]]
uses = "upload-artifact"
[jobs.steps.with]
path = "status"

[[jobs.steps]]
uses = "upload-artifact"
[jobs.steps.with]
path = "heavy-1s.dendro.zst"

[[jobs.steps]]
uses = "upload-artifact"
[jobs.steps.with]
path = "heavy-100ms.dendro.zst"

[[jobs.steps]]
uses = "shell"
[jobs.steps.with]
run = "set +e; rc=$(cat status); echo \"work exited $rc\"; exit $rc"
