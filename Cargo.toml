[package]
name = "dendro"
version = "0.5.1-alpha.0"
edition = "2021"
# The floor the dependency graph sets (arrow/parquet 60 require 1.88). CI
# builds on it, so raising it is a deliberate act rather than a drift. Note
# this also configures clippy: MSRV-gated lints stop suggesting APIs newer
# than this.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iopsystems/dendro"
description = "A segmented-parquet archive with a write-ahead log, in a single SQLite file"
keywords = ["parquet", "sqlite", "wal", "timeseries", "archive"]
categories = ["database-implementations", "encoding"]
# Repository housekeeping that serves nobody who downloads the crate.
# `WIRE.md` is NOT here: it specifies the replication wire format the way
# `FORMAT.md` specifies the file, and both are part of what the crate is.
exclude = [".github/", ".gitignore", "scripts/"]

# docs.rs builds with default features, which hides the whole writer half and
# every `test-support` item. `all-features` documents the real surface, and
# `docsrs` turns on the feature annotations so a reader can see WHICH feature
# gates an item rather than wondering why it is missing locally.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
arrow = { version = "60.0.0", optional = true }
bytes = { version = "1", optional = true }
parquet = { version = "60.0.0", default-features = false, optional = true, features = [
    "arrow",
    "simdutf8",
    "zstd",
    # `Compression::LZ4_RAW`, the codec segments are written with. Pulls in
    # `lz4_flex` (pure Rust, no C). See `segment::writer_props`.
    "lz4",
] }
# `bundled` compiles SQLite from source: slower builds, no runtime system
# dependency, and it is what lets the crate build for wasm32.
rusqlite = { version = "0.40", optional = true, features = ["bundled", "blob", "serialize"] }
serde_json = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = ["write"]
# The archive: the SQLite container, its catalog, segments, reads, rewrites
# and the archive publisher. Off, the crate is the replication wire alone
# (`replicate::{Frame, wire}`, the row types and `keys`), with no SQLite,
# arrow or parquet, for a producer that serves frames and stores nothing.
archive = [
    "dep:arrow",
    "dep:bytes",
    "dep:parquet",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:tracing",
]
# The append side: the streaming writer, its checkpoint thread, and retention.
# With it off (and `archive` on) the crate is a READER — container, catalog,
# WAL-tail materialization — which is the configuration that compiles for
# `wasm32-unknown-unknown`.
write = ["archive"]
# Test-only accessors (commit counters, fixture builders) that downstream
# crates' tests need. Not `#[cfg(test)]`: a `#[cfg(test)]` item here is
# invisible to a crate that depends on dendro.
test-support = ["write"]

# A writer in its own process, so a test can SIGKILL it. Behind
# `test-support` because that is what supplies `Archive::single`, and because
# nothing ships it.
[[bin]]
name = "append-until-killed"
path = "src/bin/append-until-killed.rs"
required-features = ["test-support"]

# The compaction gate's measurement: does read cost track segment count?
# Behind `test-support` for `Archive::single`, and because nothing ships it.
[[bin]]
name = "measure-compaction"
path = "src/bin/measure-compaction.rs"
required-features = ["test-support"]

[dev-dependencies]
# Raw connections in tests that stage a concurrent writer beside a live
# reader (`tests/read_seam.rs`), and a hand-built foreign database.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
