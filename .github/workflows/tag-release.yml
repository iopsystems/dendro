# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Tags a release when a release-preparation commit lands on main, then pushes
# the next development version. The policy lives in the shared workflow; this
# file only names what differs for this repository. See CHANGELOG.md,
# "Releasing", for the steps a release takes.

name: Tag Release

on:
  push:
    branches: [main]

jobs:
  tag-release:
    uses: brayniac/rust-workflows/.github/workflows/tag-release.yml@v1
    # By name, not `secrets: inherit`: GitHub only carries inherited secrets
    # between repositories in the same organization, and the shared workflow
    # lives under a different owner. With `inherit` the token arrives empty
    # and checkout fails after the gate has already passed.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      # The bump goes straight to main, as it does in rezolus; a bump PR for a
      # one-line change is ceremony.
      dev-bump: direct
      # A fork's main must not tag.
      only-repository: iopsystems/dendro
