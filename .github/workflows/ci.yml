name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features test-support

  # The reader half must build without the writer thread, because
  # `std::thread::spawn` compiles for wasm32 and then panics at runtime.
  # Nothing else catches a thread creeping onto the read path.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # zstd and SQLite are compiled from C, so the wasm build needs a clang
      # that can target wasm32. Ubuntu's can.
      - run: cargo check --no-default-features --target wasm32-unknown-unknown

  # `write` off must also work natively: the reader build is a supported
  # configuration, not merely a wasm artifact.
  reader-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets`: a plain `check` compiles the lib only, so a test that
      # names a `write`-gated item builds green here and breaks for anyone
      # actually using the reader build.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  # The diagrams are derived from the crate's own structures, so a rename they
  # claim either shows up in the regenerated output or breaks the generator.
  # This job is what makes that a build failure rather than a stale picture.
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      # The `.dot` is this crate's own string output, so it is deterministic and
      # can be diffed. The SVG is NOT: graphviz 2.43 (Ubuntu) and 16.0
      # (Homebrew) lay the same graph out differently, down to the preamble, so
      # diffing rendered bytes would fail for everyone whose graphviz is not the
      # committer's. `check_diagrams` closes that gap by asserting the committed
      # SVG draws the same nodes and edges the `.dot` declares - the claim,
      # rather than the pixels.
      - name: The .dot sources are up to date
        run: |
          cargo run --quiet --example gen_diagrams
          if ! git diff --exit-code -- 'docs/*.dot'; then
            echo "::error::docs/*.dot is stale - run docs/regen.sh and commit the result" >&2
            exit 1
          fi
      - name: The committed SVGs match their sources
        run: cargo run --quiet --example check_diagrams
      # And the rendering checks run against THIS graphviz too, not only the
      # one the diagrams were committed from.
      - name: Bounds and collisions hold on this graphviz
        run: |
          for f in model write-path read-path; do
            dot -Tsvg "docs/$f.dot" -o "docs/$f.svg"
          done
          cargo run --quiet --example check_diagrams
          git checkout -- docs/
