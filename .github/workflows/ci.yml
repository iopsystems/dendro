name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features test-support

  # The reader half must build without the writer thread, because
  # `std::thread::spawn` compiles for wasm32 and then panics at runtime.
  # Nothing else catches a thread creeping onto the read path.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # zstd and SQLite are compiled from C, so the wasm build needs a clang
      # that can target wasm32. Ubuntu's can.
      - run: cargo check --no-default-features --target wasm32-unknown-unknown

  # `write` off must also work natively: the reader build is a supported
  # configuration, not merely a wasm artifact.
  reader-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets`: a plain `check` compiles the lib only, so a test that
      # names a `write`-gated item builds green here and breaks for anyone
      # actually using the reader build.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  # The diagrams are derived from the crate's own structures, so a rename they
  # claim either shows up in the regenerated output or breaks the generator.
  # This job is what makes that a build failure rather than a stale picture.
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: docs/regen.sh
      - name: Diagrams are up to date
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is stale - run docs/regen.sh and commit the result" >&2
            exit 1
          fi
