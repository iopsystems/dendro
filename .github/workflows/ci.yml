name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features test-support

  # The reader half must build without the writer thread, because
  # `std::thread::spawn` compiles for wasm32 and then panics at runtime.
  # Nothing else catches a thread creeping onto the read path.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # zstd and SQLite are compiled from C, so the wasm build needs a clang
      # that can target wasm32. Ubuntu's can.
      - run: cargo check --no-default-features --target wasm32-unknown-unknown

  # `write` off must also work natively: the reader build is a supported
  # configuration, not merely a wasm artifact.
  reader-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets`: a plain `check` compiles the lib only, so a test that
      # names a `write`-gated item builds green here and breaks for anyone
      # actually using the reader build.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  # The documentation is a deliverable: it is what a reader sees on docs.rs,
  # and a broken intra-doc link ships silently without this. `-D warnings`
  # because rustdoc reports unresolved links as warnings by default.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # `rust-version` in Cargo.toml is a promise. This is what keeps it one:
  # without it the floor drifts up silently the first time anyone uses a
  # newer API, and clippy's MSRV-gated lints quietly encourage exactly that.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so tests and the test-support binaries are covered,
      # not just the library.
      - run: cargo check --all-targets --all-features
      - run: cargo check --all-targets --no-default-features

  # What `cargo publish` will actually do, minus the upload: packaging, then
  # a full build of the packaged tree. Catches a file missing from the
  # package and a dependency that only resolves locally.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
