# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs from the tag that tag-release.yml creates: checks that the tag names
# the manifest version and that CHANGELOG.md has a section for it, runs the
# same checks CI runs, publishes the crate, and creates the GitHub release
# with that section as its notes. A tag pushed by hand runs it too.
#
# It can also be run by hand for an existing tag. A tag push runs the
# workflow file as it was at the tagged commit, so a fix to this file cannot
# reach a release that already failed; the manual run uses the file on main
# and checks out the tag.
#
# Publishing authenticates with CRATES_IO_TOKEN, a crates.io API token with
# publish scope for this crate, set as a repository secret.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.repository == 'iopsystems/dendro'
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Section-aware, like the tag-release workflow: a `version` under
      # [dependencies] must not be mistaken for the package's.
      - name: The tag names the manifest version
        id: version
        run: |
          VERSION=$(awk -F' *= *' '
            /^\[/  { inpkg = ($0 ~ /^\[package\]/); next }
            inpkg && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' Cargo.toml)
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The release notes are the CHANGELOG section for this version: from its
      # `## [X.Y.Z]` heading to the next `## ` heading of any kind, since the
      # heading after the newest release is "Before 1.0", not a version. A
      # release without a section is refused, because an empty release page
      # is how a changelog stops being kept.
      # Written outside the checkout: `cargo publish` refuses a working tree
      # with an uncommitted file in it, and this file is not part of the crate.
      - name: CHANGELOG.md has a section for this version
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($0 ~ "^## \\[" v "\\]") ; next }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "Release notes:"; cat "$NOTES"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The same bar CI holds main to, run again here because a tag push does
      # not trigger CI and a release must not depend on remembering that.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features test-support
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CRATES_IO_TOKEN is empty; set it as a repository secret"
            exit 1
          fi
          cargo publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            --title "dendro $TAG" \
            --notes-file "$NOTES" \
            --verify-tag \
            $FLAGS
